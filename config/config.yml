---
default:
  tourn:
    production_mode:           false
    ping_pong_balls:           false
    use_cohort_stats:          true

  database:
    strict_checkpoints:        false

  admin:
    checkpoint_db:
      gen_seed_bracket:        [post]
      tabulate_seed_results:   [pre, post]
      comp_team_seeds:         [pre, post]
      gen_tourn_brackets:      [post]
      tabulate_tourn_results:  [pre, post]
      gen_semis_bracket:       [post]
      tabulate_semis_results:  [pre, post]
      gen_finals_bracket:      [post]
      tabulate_finals_results: [pre, post]
    reload_int:                5000

  mobile:
    update_int:
      cur_game:                5000
      compl_game:              2000
      cur_pick:                5000

  dash:
    update_int:
      sd_dash:                 5000
      rr_dash:                 5000
      pt_dash:                 5000
      ff_dash:                 10000
    update_adj:
      sd_dash:                 350
      rr_dash:                 200
      pt_dash:                 100
      ff_dash:                 100

  chart:
    update_int:
      sd_bracket:              10000
      sd_scores:               10000
      rr_brackets:             10000
      rr_scores:               10000
    update_adj:
      sd_bracket:              300
      sd_scores:               100
      rr_brackets:             300
      rr_scores:               100

  mobile_agent:
    update_int:
      cur_game:                5000
      compl_game:              2000
      cur_pick:                5000
    wait_time:
      check_view:              30
      submit_score:            60
      accept_score:            15
      correct_score:           15
      pick_partner:            10
    correct_score_freq:        0.10
    time_variance:             [0.5, 1.5]
